{% extends "base.html" %}

{% block titulo %}
    Login - Band Playlist
{% endblock %}

{% block conteudo %}

<div class="container-login">

    <div class="caixa-login">

        <h1>🎸 Band Playlist</h1>

        <p>
            Entre com sua conta para acessar a votação.
        </p>

        <form method="POST">

            <label for="nome">
                Integrante
            </label>

            <select
                id="nome"
                name="nome"
                required
            >

                <option value="">
                    Selecione seu nome
                </option>

                {% for usuario in usuarios %}

                    <option value="{{ usuario.nome }}">
                        {{ usuario.nome }}
                    </option>

                {% endfor %}

            </select>

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button
                class="salvar"
                type="submit"
            >
                Entrar
            </button>

        </form>

    </div>

</div>

{% endblock %}
